apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-ingress
  namespace: fraud-detection
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: fraud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-frontend-service
                port:
                  number: 3000
    - host: api.fraud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-backend-service
                port:
                  number: 8000