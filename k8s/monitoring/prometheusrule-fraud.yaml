apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fraud-detection-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: fraud.rules
      interval: 30s
      rules:

        # ── 1. Taux de fraude > 30 % sur 10 min (avec un volume minimal) ───────
        # Calculé côté Prometheus à partir du compteur : une seule prédiction
        # frauduleuse isolée ne suffit plus à déclencher l'alerte.
        - alert: HighFraudRate
          expr: |
            (
              sum(increase(fraud_predictions_total{result="fraud"}[10m]))
              / sum(increase(fraud_predictions_total[10m]))
            ) > 0.3
            and sum(increase(fraud_predictions_total[10m])) >= 20
          for: 2m
          labels:
            severity: critical
            namespace: fraud-detection
          annotations:
            summary: "Taux de fraude anormalement élevé"
            description: "Taux de fraude sur 10 min : {{ $value | humanizePercentage }} (seuil 30 %, au moins 20 prédictions)."

        # ── 2. Drift detected ─────────────────────────────────────────────────
        - alert: DriftDetected
          expr: fraud_drift_detected == 1
          for: 0m
          labels:
            severity: warning
            namespace: fraud-detection
          annotations:
            summary: "Data drift detected"
            description: "Evidently detected data drift. Score: {{ $value }}. Retraining triggered automatically."

        # ── 3. API latency > 2s ───────────────────────────────────────────────
        - alert: HighLatency
          expr: |
            histogram_quantile(0.99,
              rate(fraud_prediction_latency_seconds_bucket[5m])
            ) > 2
          for: 2m
          labels:
            severity: warning
            namespace: fraud-detection
          annotations:
            summary: "API latency too high"
            description: "P99 prediction latency exceeds 2 seconds."

        # ── 4. Pod crash ──────────────────────────────────────────────────────
        - alert: PodCrash
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="fraud-detection"
            }[5m]) > 0
          for: 0m
          labels:
            severity: critical
            namespace: fraud-detection
          annotations:
            summary: "Pod crash detected"
            description: "Pod {{ $labels.pod }} in fraud-detection has restarted unexpectedly."

        # ── 5. Pipeline ML Jenkins en échec ──────────────────────────────────
        # Métrique poussée par jenkins/push_metrics.py vers le Pushgateway.
        - alert: MLPipelineFailed
          expr: fraud_jenkins_build_status == 0
          for: 0m
          labels:
            severity: warning
            namespace: fraud-detection
          annotations:
            summary: "Échec du pipeline ML Jenkins"
            description: "Le dernier build du pipeline ML a échoué (validation des données, entraînement ou test de scénario)."
