apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fraud-backend-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: fraud-backend
  namespaceSelector:
    matchNames:
      - fraud-detection
  endpoints:
    - port: http
      path: /metrics
      interval: 15s